<!DOCTYPE html>
<html lang="es-NZ">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trabajos Part-Time NZ</title>
  <meta name="description" content="Avisos de trabajos part-time en Nueva Zelanda. Interfaz en español, avisos tal como los publica cada empleador (mayormente en inglés)." />
  <meta name="theme-color" content="#1d4ed8" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1>Trabajos Part-Time NZ</h1>
      <p class="tagline">Empleos part-time en Nueva Zelanda · interfaz en español, avisos en inglés</p>
    </div>
  </header>

  <main class="container">
    <section class="search-bar">
      <input id="search-input" type="search" placeholder="Buscar por palabra clave (ej: retail, cocina)..." />
      <input id="region-input" type="search" placeholder="Región o ciudad (ej: Auckland)..." />
      <button id="search-button">Buscar</button>
    </section>

    <p id="status-line" class="status-line">Cargando avisos...</p>

    <section id="jobs-list" class="jobs-list" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Datos de: Adzuna. Actualizado automáticamente.</p>
    </div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
